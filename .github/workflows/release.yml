name: Release

# Push a tag like v1.0.0 (matching versionName in app/build.gradle.kts) to
# publish a signed GitHub Release. The NextColor Apps F-Droid repo picks up
# new releases from here on its own.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # Both are needed to attest the APK
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Check tag matches versionName
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version in app/build.gradle.kts"
            exit 1
          fi

      - name: Unpack signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The RELEASE_KEYSTORE_BASE64 secret is missing. See RELEASING.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Build signed APK
        env:
          RELEASE_KEYSTORE: ${{ runner.temp }}/release.p12
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "SecureTap-$GITHUB_REF_NAME.apk"

      # Records that this exact APK was built by this workflow from this commit.
      # Anyone can check a download with: gh attestation verify <file> --repo <owner>/SecureTap
      - name: Attest APK
        uses: actions/attest@v4
        with:
          subject-path: SecureTap-${{ github.ref_name }}.apk

      - name: Publish GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" "SecureTap-$GITHUB_REF_NAME.apk" \
            --title "SecureTap $GITHUB_REF_NAME" \
            --notes-file "fastlane/metadata/android/en-US/changelogs/$(sed -n 's/^ *versionCode = \([0-9]*\)/\1/p' app/build.gradle.kts).txt"
